<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitFun  - Login & Signup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="main-header">
    <nav id="navbar">
      <div class="logo">
        <div class="logo-icon">FF</div>
        FitFun 
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#services">Services</a></li>
        <li><a href="auth.html" class="active">Login & Signup</a></li>
      </ul>
    </nav>
  </header>

  <main style="margin-top:120px;" class="container">
    <section id="auth">
      <div class="form-box">
        <h2>Signup</h2>
        <form id="signupForm">
          <input type="text" id="fullName" placeholder="Full Name" required>
          <input type="email" id="email" placeholder="Email" required>
          <input type="text" id="usernameSignup" placeholder="Username" required>
          <input type="password" id="passwordSignup" placeholder="Password" required>
          <button type="submit">Sign Up</button>
        </form>
      </div>

      <div class="form-box">
        <h2>Login</h2>
        <form id="loginForm">
          <input type="text" id="usernameLogin" placeholder="Username" required>
          <input type="password" id="passwordLogin" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
      </div>

      <p id="message"></p>
    </section>
  </main>

  <footer id="main-footer">
    <p>Copyright © 2025 · FitFun Hub</p>
  </footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>
</body>
</html>
